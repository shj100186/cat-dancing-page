<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- 고양이 몸통 -->
  <ellipse cx="100" cy="130" rx="45" ry="35" fill="#FF6B35" stroke="#FF5722" stroke-width="2"/>
  
  <!-- 고양이 머리 -->
  <circle cx="100" cy="80" r="40" fill="#FF6B35" stroke="#FF5722" stroke-width="2"/>
  
  <!-- 고양이 귀 -->
  <path d="M70 60 L80 40 L90 60 Z" fill="#FF6B35" stroke="#FF5722" stroke-width="2"/>
  <path d="M110 60 L120 40 L130 60 Z" fill="#FF6B35" stroke="#FF5722" stroke-width="2"/>
  
  <!-- 귀 안쪽 -->
  <path d="M74 58 L80 46 L86 58 Z" fill="#FFB74D"/>
  <path d="M114 58 L120 46 L126 58 Z" fill="#FFB74D"/>
  
  <!-- 고양이 눈 -->
  <ellipse cx="88" cy="75" rx="8" ry="12" fill="#2E7D32"/>
  <ellipse cx="112" cy="75" rx="8" ry="12" fill="#2E7D32"/>
  
  <!-- 눈동자 -->
  <ellipse cx="88" cy="78" rx="3" ry="8" fill="#000"/>
  <ellipse cx="112" cy="78" rx="3" ry="8" fill="#000"/>
  
  <!-- 눈 하이라이트 -->
  <circle cx="86" cy="74" r="2" fill="#FFF"/>
  <circle cx="110" cy="74" r="2" fill="#FFF"/>
  
  <!-- 고양이 코 -->
  <path d="M100 85 L95 95 L105 95 Z" fill="#E91E63"/>
  
  <!-- 고양이 입 -->
  <path d="M100 95 Q90 105 85 100" fill="none" stroke="#333" stroke-width="2" stroke-linecap="round"/>
  <path d="M100 95 Q110 105 115 100" fill="none" stroke="#333" stroke-width="2" stroke-linecap="round"/>
  
  <!-- 수염 -->
  <line x1="60" y1="85" x2="85" y2="88" stroke="#333" stroke-width="2" stroke-linecap="round"/>
  <line x1="60" y1="95" x2="85" y2="95" stroke="#333" stroke-width="2" stroke-linecap="round"/>
  <line x1="115" y1="88" x2="140" y2="85" stroke="#333" stroke-width="2" stroke-linecap="round"/>
  <line x1="115" y1="95" x2="140" y2="95" stroke="#333" stroke-width="2" stroke-linecap="round"/>
  
  <!-- 고양이 다리 -->
  <ellipse cx="75" cy="155" rx="12" ry="20" fill="#FF6B35" stroke="#FF5722" stroke-width="2"/>
  <ellipse cx="125" cy="155" rx="12" ry="20" fill="#FF6B35" stroke="#FF5722" stroke-width="2"/>
  
  <!-- 고양이 발 -->
  <ellipse cx="75" cy="170" rx="14" ry="8" fill="#FF5722"/>
  <ellipse cx="125" cy="170" rx="14" ry="8" fill="#FF5722"/>
  
  <!-- 고양이 꼬리 -->
  <path d="M145 120 Q160 100 155 80 Q150 85 145 105" fill="#FF6B35" stroke="#FF5722" stroke-width="2"/>
  
  <!-- 몸통 무늬 -->
